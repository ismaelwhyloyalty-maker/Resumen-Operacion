name: Monitoreo de Outlook cada 5 minutos

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor-email:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Ejecutar monitoreo de Outlook
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: python email_monitor.py
      
      - name: Configurar Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      
      - name: Guardar cambios en el repositorio
        run: |
          if [ -f reporte_operaciones.csv ]; then
            git add reporte_operaciones.csv
            git commit -m "Actualizar reporte de operaciones - $(date +'%Y-%m-%d %H:%M:%S')" || echo "No hay cambios para hacer commit"
            git push
          else
            echo "Archivo CSV no generado"
          fi
